
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ads_platform_db
    environment:
      POSTGRES_USER: ads_user
      POSTGRES_PASSWORD: ads123
      POSTGRES_DB: ads_platform
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_user -d ads_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ads_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ads_platform_app
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DEBUG: "True"
      DATABASE_URL: postgresql+psycopg2://ads_user:ads123@db:5432/ads_platform
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - ads_network
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
    driver: local

networks:
  ads_network:
    driver: bridge
